name: Feature Request
description: Suggest an idea or enhancement for MQTT Gateway
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement for MQTT Gateway!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what problem or limitation you are encountering.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you would like to see implemented or changed.
      placeholder: "Add support for..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
  - type: dropdown
    id: area
    attributes:
      label: Relevant Area
      description: Which area does this feature relate to?
      options:
        - New Broker Adapter or Protocol
        - Routing & Authorization Rules
        - Health Probes & Observability
        - Admin Panel UI & UX
        - CLI & Automation Tools
        - Documentation & Examples
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am interested in submitting a Pull Request for this feature.
