listener 1883 0.0.0.0
allow_anonymous false
persistence false
log_dest stdout

auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_cache false
auth_opt_log_level warn
auth_opt_http_host gateway
auth_opt_http_port 8085
auth_opt_http_getuser_uri /api/v1/gateway/mosquitto/auth
auth_opt_http_aclcheck_uri /api/v1/gateway/mosquitto/acl
auth_opt_http_method POST
auth_opt_http_params_mode json
auth_opt_http_response_mode status
auth_opt_http_timeout 5
